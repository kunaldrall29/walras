          description: "Top-level protocol version. Informational: routing keys on paymentPayload.x402Version,
            which is what the facilitator core registers schemes against."
        paymentPayload:
          type: object
          description: "The client's PaymentPayload: {x402Version, resource?, accepted, payload, extensions?}.

            SAC is FACTS F-052."
        amount:
          type: string
          description: "Amount in base units of the asset (USDC: 7 decimals, FACTS F-008)."
        payTo:
          type: string
          description: Recipient address the settled transfer must credit (FACTS F-035).
        maxTimeoutSeconds:
          type: number
          description: Upper bound on payment validity; the scheme derives the auth-entry ledger bound from it
            (FACTS F-034).
        extra:
          type: object
          additionalProperties: true
